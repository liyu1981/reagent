name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow only validates the build.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build library
        run: pnpm build

      - name: Build site
        run: pnpm --filter @liyu1981/reagent-site build

      - name: Check package contents
        run: npm pack --dry-run
